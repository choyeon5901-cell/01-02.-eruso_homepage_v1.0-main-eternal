<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>온라인 추모관 개설</title>
    <link rel="icon" href="public/favicon.ico" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/memorial.css?v=20260817-ext-popup">
    <meta name="eruso-api-base" content="https://api.erum2026.co.kr">
</head>
<body class="memorial-apply-page">
    <form class="contact-form memorial-apply-form" id="memorialApplyForm" novalidate>
        <h1>온라인 추모관 개설</h1>
        <p class="memorial-apply-lead">고인·추모관 정보를 입력한 뒤 입력 완료를 눌러 주세요.</p>

        <p class="form-section-title">추모관 정보</p>
        <div class="form-row-2col">
            <div class="form-row">
                <label for="memorialName">고인 성함 <span class="req">*</span></label>
                <input type="text" id="memorialName" name="memorialName" placeholder="예: 홍길동" maxlength="100" required>
            </div>
            <div class="form-row">
                <label for="roomTitle">추모관 이름 <span class="opt">(자동 제안)</span></label>
                <input type="text" id="roomTitle" name="roomTitle" placeholder="예: 故 홍길동 추모관" maxlength="120">
            </div>
        </div>
        <div class="form-row-2col">
            <div class="form-row">
                <label for="memorialSubtitle">추모관 부제 <span class="opt">(선택)</span></label>
                <input type="text" id="memorialSubtitle" name="memorialSubtitle" placeholder="예: 영원한 기억 속으로" maxlength="120">
            </div>
            <div class="form-row">
                <label for="relation">고인과의 관계 <span class="opt">(선택)</span></label>
                <input type="text" id="relation" name="relation" placeholder="부친, 배우자, 자녀 등" maxlength="40">
            </div>
        </div>
        <div class="form-row-2col">
            <div class="form-row">
                <label for="birthDate">생년월일 <span class="opt">(선택)</span></label>
                <input type="date" id="birthDate" name="birthDate">
            </div>
            <div class="form-row">
                <label for="deathDate">기일 <span class="opt">(선택)</span></label>
                <input type="date" id="deathDate" name="deathDate">
            </div>
        </div>
        <div class="form-row">
            <label for="description">고인 소개 <span class="opt">(선택, 최대 200자)</span></label>
            <textarea id="description" name="description" rows="3" maxlength="200" placeholder="공개 추모관에 표시될 고인 소개를 입력해 주세요."></textarea>
            <div class="form-char-count"><span id="descriptionCount">0</span>/200</div>
        </div>
        <div class="form-row">
            <label for="middleDescription">추가 소개 · 금언 <span class="opt">(선택)</span></label>
            <textarea id="middleDescription" name="middleDescription" rows="2" placeholder="생애, 특별한 기억, 금언 등"></textarea>
        </div>
        <div class="form-row">
            <label for="photoFile">영정사진 <span class="opt">(선택)</span></label>
            <input type="file" id="photoFile" name="photoFile" class="visually-hidden" accept="image/*,.heic,.heif">
            <label for="photoFile" class="media-pick-slot" id="photoPickLabel">
                <svg class="media-pick-icon" width="28" height="28" viewBox="0 0 256 256" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="32" y="48" width="192" height="160" rx="16" stroke="currentColor" stroke-width="12"/>
                    <circle cx="92" cy="108" r="20" stroke="currentColor" stroke-width="12"/>
                    <path d="M32 168l52-48 36 32 40-48 64 64" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="photoPickText">사진 등록</span>
                <img id="photoPreview" alt="선택한 영정" hidden>
            </label>
            <p class="form-hint">jpg, png, heic</p>
        </div>
        <div class="form-row video-register-block">
            <span class="form-label-text">추모 영상 <span class="opt">(선택)</span></span>
            <div class="media-mode-tabs" role="tablist" aria-label="추모 영상 등록 방식">
                <button type="button" class="media-mode-tab is-active" data-video-mode="file" aria-pressed="true">파일 등록</button>
                <button type="button" class="media-mode-tab" data-video-mode="url" aria-pressed="false">URL 등록</button>
            </div>
            <div id="videoFilePanel" class="video-mode-panel">
                <input type="file" id="videoFile" name="videoFile" class="visually-hidden" accept="video/mp4,video/webm,video/quicktime,.mp4,.webm,.mov">
                <label for="videoFile" class="media-pick-slot" id="videoPickLabel">
                    <svg class="media-pick-icon" width="28" height="28" viewBox="0 0 256 256" aria-hidden="true" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="24" y="56" width="152" height="144" rx="16" stroke="currentColor" stroke-width="12"/>
                        <path d="M176 112l56-32v96l-56-32V112z" stroke="currentColor" stroke-width="12" stroke-linejoin="round"/>
                    </svg>
                    <span id="videoPickText">영상 파일 선택</span>
                </label>
                <p class="form-hint">mp4, webm, mov</p>
            </div>
            <div id="videoUrlPanel" class="video-mode-panel" hidden>
                <input type="url" id="videoUrl" name="videoUrl" placeholder="https://youtube.com/... 또는 영상 직접 링크" maxlength="500" inputmode="url" autocomplete="off">
                <p class="form-hint">https:// 로 시작하는 영상 주소를 입력해 주세요.</p>
            </div>
        </div>

        <p class="form-notice" id="memorialApplyNotice" style="display:none;"></p>
        <button type="submit" class="btn btn-primary form-submit" id="memorialApplySubmit">입력 완료</button>
    </form>
    <script src="js/main.js?v=20260817-ext-popup"></script>
</body>
</html>
